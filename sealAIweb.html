<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
    --bg-0: #03060b;
    --bg-1: #060d18;
    --bg-2: #0d1a2e;
    --surface: rgba(15, 25, 45, 0.45);
    --surface-3: rgba(25, 45, 80, 0.7);
    --border: rgba(96, 165, 250, 0.18);
    --border-2: rgba(96, 165, 250, 0.45);
    --text: #dce7f7;
    --text-2: #a8b8d0;
    --text-3: #7b8db0;
    --text-4: #5a6b88;
    --accent: #60a5fa;
}

html, body { height: 100%; overflow: hidden; }

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: radial-gradient(ellipse at top, var(--bg-2) 0%, var(--bg-1) 50%, var(--bg-0) 100%);
    color: var(--text);
    font-weight: 300;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
}

#stars { position: fixed; inset: 0; z-index: 0; pointer-events: none; }

.layout {
    position: relative;
    z-index: 2;
    display: flex;
    height: 100vh;
    width: 100%;
}

.sidebar {
    width: 280px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    background: rgba(6, 13, 24, 0.7);
    border-right: 1px solid var(--border);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.sidebar.collapsed { width: 0; overflow: hidden; border-right: none; }

.new-chat {
    margin: 16px 12px 14px;
    padding: 11px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.2) 0%, rgba(59, 130, 246, 0.15) 100%);
    border: 1px solid rgba(96, 165, 250, 0.3);
    border-radius: 12px;
    color: var(--text);
    font-family: inherit;
    font-size: 14px;
    font-weight: 400;
    cursor: pointer;
    transition: all 0.25s ease;
}

.new-chat:hover {
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.35) 0%, rgba(59, 130, 246, 0.25) 100%);
    border-color: rgba(96, 165, 250, 0.55);
    transform: translateY(-1px);
}

.new-chat svg { flex-shrink: 0; }

.history-section {
    flex: 1;
    overflow-y: auto;
    padding: 0 12px 16px;
}

.history-section::-webkit-scrollbar { width: 4px; }
.history-section::-webkit-scrollbar-thumb {
    background: rgba(96, 165, 250, 0.2);
    border-radius: 2px;
}

.history-label {
    font-size: 11px;
    color: var(--text-4);
    text-transform: uppercase;
    letter-spacing: 0.12em;
    padding: 12px 8px 8px;
}

.history-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    border-radius: 10px;
    color: var(--text-2);
    font-size: 13.5px;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    border: 1px solid transparent;
}

.history-item:hover {
    background: rgba(96, 165, 250, 0.08);
    border-color: rgba(96, 165, 250, 0.15);
    color: var(--text);
}

.history-item.active {
    background: rgba(96, 165, 250, 0.15);
    border-color: rgba(96, 165, 250, 0.3);
    color: var(--text);
}

.history-item svg { flex-shrink: 0; opacity: 0.6; }
.history-item span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { flex: 1; display: flex; flex-direction: column; min-width: 0; }

.main-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 18px 24px;
    flex-shrink: 0;
}

.sidebar-toggle {
    width: 36px; height: 36px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--text-3);
    cursor: pointer;
    transition: all 0.25s ease;
    flex-shrink: 0;
}

.sidebar-toggle:hover {
    background: var(--surface-3);
    border-color: var(--border-2);
    color: #fff;
}

.chat-title {
    font-size: 14px;
    color: var(--text-2);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.chat {
    flex: 1;
    overflow-y: auto;
    padding: 12px 24px 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
}

.chat::-webkit-scrollbar { width: 6px; }
.chat::-webkit-scrollbar-thumb {
    background: rgba(96, 165, 250, 0.25);
    border-radius: 3px;
}

.welcome {
    text-align: center;
    padding: 40px 20px;
    margin: auto 0;
    animation: fadeInUp 0.9s ease both;
}

.welcome-title {
    font-size: clamp(56px, 10vw, 96px);
    font-weight: 200;
    letter-spacing: -0.02em;
    color: #dce7f7;
    line-height: 1;
    margin-bottom: 44px;
    text-shadow: 0 0 40px rgba(96, 165, 250, 0.35);
}

.divider {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    width: 100%;
    max-width: 360px;
    margin: 0 auto;
}

.divider-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(96, 165, 250, 0.45) 50%, transparent);
}

.divider-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent), 0 0 20px rgba(96, 165, 250, 0.7);
    animation: pulseDot 3s ease-in-out infinite;
}

@keyframes pulseDot {
    0%, 100% { transform: scale(1); box-shadow: 0 0 10px var(--accent); }
    50% { transform: scale(1.35); box-shadow: 0 0 14px var(--accent), 0 0 28px rgba(96, 165, 250, 1); }
}

.msg {
    max-width: 72%;
    padding: 14px 20px;
    border-radius: 22px;
    line-height: 1.6;
    font-size: 15px;
    font-weight: 300;
    word-wrap: break-word;
    animation: msgIn 0.35s cubic-bezier(0.4, 0, 0.2, 1);
}

@keyframes msgIn {
    from { opacity: 0; transform: translateY(14px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
}

@keyframes fadeInUp {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.msg.user {
    align-self: flex-end;
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.9), rgba(59, 130, 246, 0.85));
    color: #fff;
    border: 1px solid rgba(147, 197, 253, 0.4);
    box-shadow: 0 8px 28px rgba(96, 165, 250, 0.35);
    white-space: pre-wrap;
    border-bottom-right-radius: 8px;
    font-weight: 400;
}

.msg.ai {
    align-self: flex-start;
    background: rgba(15, 25, 45, 0.55);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 8px;
    backdrop-filter: blur(14px);
}

.msg.ai p { margin-bottom: 8px; }
.msg.ai p:last-child { margin-bottom: 0; }
.msg.ai strong { font-weight: 500; color: #fff; }
.msg.ai a { color: #93c5fd; text-decoration: none; border-bottom: 1px solid rgba(147, 197, 253, 0.4); }

.msg.ai code {
    background: rgba(0, 0, 0, 0.45);
    padding: 2px 7px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #93c5fd;
    border: 1px solid rgba(96, 165, 250, 0.15);
}

.msg.ai pre {
    background: rgba(0, 0, 0, 0.55);
    padding: 14px 18px;
    border-radius: 12px;
    overflow-x: auto;
    margin: 10px 0;
    border: 1px solid rgba(96, 165, 250, 0.15);
}

.msg.ai pre code { background: transparent; padding: 0; border: none; color: #dce7f7; font-size: 13px; }

.msg.error {
    align-self: center;
    background: rgba(248, 113, 113, 0.12);
    border: 1px solid rgba(248, 113, 113, 0.35);
    color: #fca5a5;
    font-size: 13px;
    padding: 10px 22px;
    max-width: 90%;
    border-radius: 999px;
}

.typing {
    align-self: flex-start;
    background: rgba(15, 25, 45, 0.55);
    border: 1px solid var(--border);
    padding: 18px 24px;
    border-radius: 22px;
    border-bottom-left-radius: 8px;
    display: flex;
    gap: 6px;
    backdrop-filter: blur(14px);
}

.typing span {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    animation: bounce 1.4s infinite;
    box-shadow: 0 0 8px rgba(96, 165, 250, 0.7);
}

.typing span:nth-child(2) { animation-delay: 0.15s; }
.typing span:nth-child(3) { animation-delay: 0.3s; }

@keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-8px); opacity: 1; }
}

.footer { padding: 12px 24px 22px; flex-shrink: 0; }

.input-wrap {
    display: flex;
    align-items: center;
    gap: 10px;
    background: rgba(15, 25, 45, 0.5);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 6px 6px 6px 20px;
    backdrop-filter: blur(14px);
    max-width: 820px;
    margin: 0 auto;
    width: 100%;
}

.input-wrap:focus-within {
    border-color: var(--border-2);
    background: rgba(20, 35, 60, 0.65);
    box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
}

.input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 300;
    line-height: 1.4;
    color: var(--text);
    padding: 10px 0;
    max-height: 120px;
    overflow-y: auto;
    scrollbar-width: none;
    -ms-overflow-style: none;
}

.input::-webkit-scrollbar { display: none; width: 0; height: 0; }
.input::placeholder { color: var(--text-4); }

.send-btn {
    width: 40px; height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border: none;
    border-radius: 50%;
    background: linear-gradient(135deg, rgba(96, 165, 250, 0.95), rgba(59, 130, 246, 0.9));
    color: #fff;
    cursor: pointer;
    transition: all 0.3s;
    flex-shrink: 0;
    box-shadow: 0 4px 16px rgba(96, 165, 250, 0.4);
}

.send-btn:hover:not(:disabled) { transform: translateY(-2px) scale(1.05); }
.send-btn:disabled { opacity: 0.35; cursor: not-allowed; }

.hint {
    font-size: 11px;
    color: #3d4d68;
    text-align: center;
    margin-top: 10px;
}

.hint kbd {
    display: inline-block;
    padding: 1px 7px;
    background: rgba(15, 25, 45, 0.5);
    border: 1px solid var(--border);
    border-radius: 5px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--text-3);
}

@media (max-width: 768px) {
    .sidebar {
        position: fixed;
        left: 0; top: 0;
        height: 100vh;
        z-index: 100;
        box-shadow: 4px 0 30px rgba(0, 0, 0, 0.5);
    }
    .sidebar:not(.mobile-open) { transform: translateX(-100%); }
    .chat { padding: 12px 16px 20px; }
    .footer { padding: 10px 16px 16px; }
    .main-header { padding: 14px 16px; }
    .msg { max-width: 88%; font-size: 14.5px; }
    .input-wrap { padding: 4px 4px 4px 16px; }
    .hint { display: none; }
    .backdrop {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.5);
        z-index: 99;
    }
}
</style>
</head>
<body>

<canvas id="stars"></canvas>

<div class="layout">
    <aside class="sidebar" id="sidebar">
        <button class="new-chat" id="newChatBtn" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19"/>
                <line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <span>New chat</span>
        </button>
        <div class="history-section">
            <div class="history-label">Today</div>
            <div id="historyList"></div>
        </div>
    </aside>

    <main class="main">
        <header class="main-header">
            <button class="sidebar-toggle" id="sidebarToggle" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="9" y1="3" x2="9" y2="21"/>
                </svg>
            </button>
            <div class="chat-title" id="chatTitle">New chat</div>
        </header>

        <div class="chat" id="chat">
            <div class="welcome" id="welcome">
                <h2 class="welcome-title">Welcome</h2>
                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-dot"></span>
                    <span class="divider-line"></span>
                </div>
            </div>
        </div>

        <footer class="footer">
            <div class="input-wrap">
                <textarea id="input" class="input" placeholder="Type a message..." rows="1" autocomplete="off"></textarea>
                <button id="sendBtn" class="send-btn" type="button">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="22" y1="2" x2="11" y2="13"/>
                        <polygon points="22 2 15 22 11 13 2 9 22 2"/>
                    </svg>
                </button>
            </div>
            <p class="hint"><kbd>Enter</kbd> to send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</p>
        </footer>
    </main>
</div>

<script>
/* ============================================================
   ⬇⬇⬇  ВСТАВЬ СЮДА СВОЙ GROQ API КЛЮЧ  ⬇⬇⬇
   ============================================================ */
const GROQ_API_KEY = 'gsk_ВСТАВЬ_СЮДА_СВОЙ_КЛЮЧ';
/* ============================================================ */

const GROQ_MODEL = 'llama-3.3-70b-versatile';
const SYSTEM_PROMPT = 'You are a helpful AI assistant. Answer concisely. Use markdown for code blocks.';
const MAX_HISTORY = 20;

(function () {
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const sidebar = document.getElementById('sidebar');
    const sidebarToggle = document.getElementById('sidebarToggle');
    const newChatBtn = document.getElementById('newChatBtn');
    const historyList = document.getElementById('historyList');
    const chatTitle = document.getElementById('chatTitle');

    let history = [];
    let isWaiting = false;
    let sessions = [];
    let currentSessionId = null;

    try {
        const raw = localStorage.getItem('seal_sessions');
        if (raw) {
            const p = JSON.parse(raw);
            if (Array.isArray(p)) sessions = p;
        }
    } catch (e) {
        try { localStorage.removeItem('seal_sessions'); } catch (_) {}
        sessions = [];
    }

    function saveSessions() {
        try { localStorage.setItem('seal_sessions', JSON.stringify(sessions)); } catch (_) {}
    }

    /* ================= STARS ================= */
    (function () {
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let W, H, stars = [], t = 0;
        const mouse = { x: 0, y: 0 };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
            generate();
        }

        function generate() {
            stars = [];
            const count = Math.floor((W * H) / 8000);
            for (let i = 0; i < count; i++) {
                stars.push({
                    x: Math.random() * W, y: Math.random() * H,
                    r: Math.random() * 1.1 + 0.2,
                    baseAlpha: Math.random() * 0.55 + 0.2,
                    phase: Math.random() * Math.PI * 2,
                    speed: Math.random() * 0.6 + 0.2,
                    parallax: Math.random() * 0.4 + 0.1,
                });
            }
        }

        function draw() {
            t += 0.016;
            ctx.clearRect(0, 0, W, H);
            for (const s of stars) {
                const tw = Math.sin(t * s.speed + s.phase) * 0.35 + 0.65;
                const a = s.baseAlpha * tw;
                const px = (mouse.x - W / 2) * 0.008 * s.parallax;
                const py = (mouse.y - H / 2) * 0.008 * s.parallax;
                if (s.r > 0.9) {
                    const g = ctx.createRadialGradient(s.x + px, s.y + py, 0, s.x + px, s.y + py, s.r * 6);
                    g.addColorStop(0, `rgba(150, 190, 255, ${a * 0.4})`);
                    g.addColorStop(1, 'rgba(96, 165, 250, 0)');
                    ctx.fillStyle = g;
                    ctx.beginPath();
                    ctx.arc(s.x + px, s.y + py, s.r * 6, 0, Math.PI * 2);
                    ctx.fill();
                }
                ctx.beginPath();
                ctx.arc(s.x + px, s.y + py, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(210, 225, 255, ${a})`;
                ctx.fill();
            }
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', resize);
        window.addEventListener('mousemove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
        resize();
        draw();
    })();

    /* ================= HELPERS ================= */
    function scrollDown() { chatEl.scrollTop = chatEl.scrollHeight; }

    function escapeHTML(str) {
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
    }

    function renderMarkdown(text) {
        let html = escapeHTML(text);
        html = html.replace(/```(\w*)\n?([\s\S]*?)```/g, (_, l, code) => `<pre><code>${code.trim()}</code></pre>`);
        html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
        html = html.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>');
        html = html.replace(/(https?:\/\/[^\s]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>');
        html = html.split('\n').map(line => {
            if (/^\s*<.+>\s*$/.test(line)) return line;
            if (line.trim() === '') return '';
            return `<p>${line}</p>`;
        }).join('');
        return html;
    }

    function addMessage(text, role) {
        const div = document.createElement('div');
        div.className = 'msg ' + role;
        if (role === 'ai') div.innerHTML = renderMarkdown(text);
        else div.textContent = text;
        chatEl.appendChild(div);
        scrollDown();
    }

    function addError(text) {
        const div = document.createElement('div');
        div.className = 'msg error';
        div.textContent = '⚠ ' + text;
        chatEl.appendChild(div);
        scrollDown();
    }

    function addTyping() {
        const div = document.createElement('div');
        div.className = 'typing';
        div.id = 'typing';
        div.innerHTML = '<span></span><span></span><span></span>';
        chatEl.appendChild(div);
        scrollDown();
    }

    function removeTyping() {
        const t = document.getElementById('typing');
        if (t) t.remove();
    }

    /* ================= GROQ API ================= */
    async function callGroq(userMessage, hist) {
        const messages = [{ role: 'system', content: SYSTEM_PROMPT }];
        for (const m of hist.slice(-MAX_HISTORY)) {
            messages.push({ role: m.role, content: m.content });
        }
        messages.push({ role: 'user', content: userMessage });

        const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': 'Bearer ' + GROQ_API_KEY,
            },
            body: JSON.stringify({
                model: GROQ_MODEL,
                messages: messages,
                temperature: 0.7,
                max_tokens: 1500,
            }),
        });

        if (!res.ok) {
            const err = await res.text().catch(() => '');
            throw new Error(`Groq HTTP ${res.status}: ${err.slice(0, 200)}`);
        }

        const data = await res.json();
        return data.choices[0].message.content || '';
    }

    /* ================= SESSIONS ================= */
    function renderHistory() {
        historyList.innerHTML = '';
        if (sessions.length === 0) {
            const e = document.createElement('div');
            e.className = 'history-label';
            e.style.opacity = '0.6';
            e.textContent = 'No chats yet';
            historyList.appendChild(e);
            return;
        }
        sessions.forEach(s => {
            const item = document.createElement('div');
            item.className = 'history-item' + (s.id === currentSessionId ? ' active' : '');
            item.innerHTML = `
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
                <span>${escapeHTML(s.title || 'Chat')}</span>
            `;
            item.addEventListener('click', () => loadSession(s.id));
            historyList.appendChild(item);
        });
    }

    function createSession() {
        const id = 's_' + Date.now();
        const s = { id, title: 'New chat', history: [], createdAt: Date.now() };
        sessions.unshift(s);
        saveSessions();
        renderHistory();
        return s;
    }

    function loadSession(id) {
        const s = sessions.find(x => x.id === id);
        if (!s) return;
        currentSessionId = id;
        history = Array.isArray(s.history) ? s.history.slice() : [];

        chatEl.innerHTML = '';
        if (history.length === 0) {
            showWelcome();
        } else {
            history.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg ' + (m.role === 'user' ? 'user' : 'ai');
                if (m.role === 'assistant') div.innerHTML = renderMarkdown(m.content);
                else div.textContent = m.content;
                chatEl.appendChild(div);
            });
            scrollDown();
        }
        chatTitle.textContent = s.title;
        renderHistory();
        closeMobileSidebar();
    }

    function showWelcome() {
        chatEl.innerHTML = `
            <div class="welcome" id="welcome">
                <h2 class="welcome-title">Welcome</h2>
                <div class="divider">
                    <span class="divider-line"></span>
                    <span class="divider-dot"></span>
                    <span class="divider-line"></span>
                </div>
            </div>
        `;
    }

    function updateSessionTitle(text) {
        const s = sessions.find(x => x.id === currentSessionId);
        if (!s) return;
        if (s.title === 'New chat') {
            s.title = text.slice(0, 40) + (text.length > 40 ? '...' : '');
            chatTitle.textContent = s.title;
            saveSessions();
            renderHistory();
        }
    }

    function persistMessage(role, content) {
        const s = sessions.find(x => x.id === currentSessionId);
        if (!s) return;
        if (!Array.isArray(s.history)) s.history = [];
        s.history.push({ role, content });
        saveSessions();
    }

    /* ================= SEND ================= */
    async function handleSend() {
        const text = (inputEl.value || '').trim();
        if (!text || isWaiting) return;

        if (!currentSessionId) {
            const s = createSession();
            currentSessionId = s.id;
        }

        inputEl.value = '';
        inputEl.style.height = 'auto';
        isWaiting = true;
        sendBtn.disabled = true;

        const w = document.getElementById('welcome');
        if (w) w.remove();

        addMessage(text, 'user');
        updateSessionTitle(text);
        persistMessage('user', text);
        addTyping();

        try {
            if (!GROQ_API_KEY || !GROQ_API_KEY.startsWith('gsk_')) {
                removeTyping();
                addError('API key not set. Open the file and paste your Groq key into GROQ_API_KEY at the top of <script>.');
                return;
            }

            const reply = await callGroq(text, history);

            removeTyping();
            addMessage(reply, 'ai');

            history.push({ role: 'user', content: text });
            history.push({ role: 'assistant', content: reply });
            persistMessage('assistant', reply);
        } catch (e) {
            removeTyping();
            addError(e.message);
        } finally {
            isWaiting = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    function autoResize() {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    }

    /* ================= EVENTS ================= */
    inputEl.addEventListener('input', autoResize);
    inputEl.addEventListener('keydown', e => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            handleSend();
        }
    });
    sendBtn.addEventListener('click', e => {
        e.preventDefault();
        handleSend();
    });

    /* ================= SIDEBAR ================= */
    function isMobile() { return window.innerWidth <= 768; }

    sidebarToggle.addEventListener('click', () => {
        if (isMobile()) {
            sidebar.classList.toggle('mobile-open');
            toggleBackdrop(sidebar.classList.contains('mobile-open'));
        } else {
            sidebar.classList.toggle('collapsed');
        }
    });

    function closeMobileSidebar() {
        if (isMobile()) {
            sidebar.classList.remove('mobile-open');
            toggleBackdrop(false);
        }
    }

    function toggleBackdrop(show) {
        let bd = document.querySelector('.backdrop');
        if (show && !bd) {
            bd = document.createElement('div');
            bd.className = 'backdrop';
            bd.addEventListener('click', closeMobileSidebar);
            document.body.appendChild(bd);
        } else if (!show && bd) {
            bd.remove();
        }
    }

    /* ================= NEW CHAT ================= */
    newChatBtn.addEventListener('click', () => {
        currentSessionId = null;
        history = [];
        chatEl.innerHTML = '';
        showWelcome();
        chatTitle.textContent = 'New chat';
        renderHistory();
        closeMobileSidebar();
        inputEl.focus();
    });

    /* ================= INIT ================= */
    renderHistory();
    inputEl.focus();
})();
</script>
</body>
</html>
